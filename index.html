<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Starting a new project</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --ground: #EDEFF1;
    --surface: #FFFFFF;
    --sunken: #E3E6E9;
    --ink: #181B1E;
    --muted: #5F686F;
    --faint: #8B939A;
    --line: #D5DADE;
    --line-strong: #B8BFC5;
    --accent: #2C5B4F;
    --accent-ink: #FFFFFF;
    --accent-soft: #DCE8E4;
    --shell-body: "Source Serif 4", Georgia, "Times New Roman", serif;
    --shell-ui: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --product: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #15181B;
      --surface: #1D2226;
      --sunken: #121518;
      --ink: #E7EAEC;
      --muted: #9BA3AA;
      --faint: #79828A;
      --line: #2E353B;
      --line-strong: #434C53;
      --accent: #78AE9F;
      --accent-ink: #10201C;
      --accent-soft: #23342F;
    }
  }
  :root[data-theme="dark"] {
    --ground: #15181B;
    --surface: #1D2226;
    --sunken: #121518;
    --ink: #E7EAEC;
    --muted: #9BA3AA;
    --faint: #79828A;
    --line: #2E353B;
    --line-strong: #434C53;
    --accent: #78AE9F;
    --accent-ink: #10201C;
    --accent-soft: #23342F;
  }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--shell-body);
    font-size: 17px;
    line-height: 1.55;
  }
  * { box-sizing: border-box; }

  .rail {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
    background: var(--ground);
    border-bottom: 1px solid var(--line);
  }
  .rail-inner {
    max-width: 1180px;
    margin: 0 auto;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: var(--shell-ui);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .rail-bar {
    flex: 1;
    height: 3px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
  }
  .rail-reset {
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--faint);
    background: none;
    border: 0;
    padding: 2px 0;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .rail-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 320ms ease;
  }
  @media (prefers-reduced-motion: reduce) { .rail-fill { transition: none; } }

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 40px 90px;
  }
  .col { max-width: 660px; }

  .eyebrow {
    font-family: var(--shell-ui);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 10px;
  }
  h1 {
    font-family: var(--shell-body);
    font-weight: 600;
    font-size: clamp(26px, 4vw, 34px);
    line-height: 1.2;
    letter-spacing: -0.01em;
    text-wrap: balance;
    margin: 0 0 14px;
  }
  .lede { color: var(--muted); margin: 0 0 22px; }
  .lede p { margin: 0 0 12px; }
  .lede ul { margin: 0 0 12px; padding-left: 20px; }
  .lede li { margin-bottom: 6px; }

  .scenario {
    border-left: 3px solid var(--accent);
    background: var(--surface);
    padding: 18px 22px;
    margin: 0 0 22px;
    font-size: 19px;
    line-height: 1.5;
  }
  .scenario p { margin: 0; }

  .instruct {
    font-family: var(--shell-ui);
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    margin: 0 0 14px;
  }

  .notice {
    display: flex;
    gap: 10px;
    background: var(--accent-soft);
    color: var(--ink);
    padding: 14px 16px;
    font-size: 15px;
    line-height: 1.45;
    margin: 0 0 24px;
    border-radius: 2px;
  }
  .notice b { font-weight: 600; }

  .field { margin-bottom: 26px; }
  .field label {
    display: block;
    font-family: var(--shell-ui);
    font-size: 15px;
    font-weight: 500;
    line-height: 1.4;
    margin-bottom: 4px;
  }
  .field .hint {
    font-size: 14px;
    color: var(--faint);
    margin: 0 0 8px;
  }
  .field .req {
    color: var(--faint);
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  input[type="text"], textarea {
    width: 100%;
    font-family: var(--shell-body);
    font-size: 16px;
    line-height: 1.5;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 2px;
    padding: 10px 12px;
  }
  textarea { min-height: 104px; resize: vertical; }
  input[type="text"]:focus-visible, textarea:focus-visible,
  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .choices { display: flex; flex-wrap: wrap; gap: 8px; }
  .choice {
    font-family: var(--shell-ui);
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 2px;
    padding: 9px 16px;
    cursor: pointer;
  }
  .choice[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }

  .footer {
    position: sticky;
    bottom: 0;
    background: linear-gradient(to top, var(--ground) 68%, transparent);
    padding-block: 18px 10px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    margin-top: 14px;
  }
  .next {
    font-family: var(--shell-ui);
    font-size: 15px;
    font-weight: 600;
    background: var(--accent);
    color: var(--accent-ink);
    border: 1px solid var(--accent);
    border-radius: 2px;
    padding: 12px 28px;
    cursor: pointer;
  }
  .next[disabled] {
    background: transparent;
    color: var(--faint);
    border-color: var(--line-strong);
    cursor: not-allowed;
  }
  .footnote {
    font-family: var(--shell-ui);
    font-size: 13px;
    color: var(--faint);
    margin-left: 14px;
  }

  /* ---- stimulus: the product screen ---- */
  .stage {
    overflow-x: auto;
    background: var(--sunken);
    border: 1px solid var(--line);
    padding: 20px;
    margin-bottom: 28px;
  }
  .screen {
    min-width: 980px;
    background: #FFFFFF;
    color: #101214;
    font-family: var(--product);
    padding: 28px 30px 10px;
  }
  .screen h2 {
    font-family: var(--product);
    font-size: 23px;
    font-weight: 500;
    margin: 0 0 22px;
    color: #101214;
  }
  .screen .kicker {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #6B7177;
    margin: 0 0 10px;
  }
  .cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .card {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    text-align: left;
    font-family: var(--product);
    background: #FFFFFF;
    border: 1px solid #E6E8EA;
    border-radius: 6px;
    padding: 10px 12px 12px;
    cursor: pointer;
  }
  .card:hover { border-color: #AEB4B9; }
  .thumb {
    display: block;
    background: #F4F4F4;
    border-radius: 4px;
    aspect-ratio: 596 / 250;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 5px;
  }
  .card-name { font-size: 15px; font-weight: 500; color: #101214; }
  .plus { font-size: 16px; color: #101214; line-height: 1; }
  .card-desc { font-size: 13px; line-height: 1.38; color: #3F464C; margin-bottom: 18px; }
  .card-count { font-size: 12px; color: #80878D; margin-top: auto; }

  .screen-meta {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #6B7177;
    margin: 26px 0 12px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 18px; }
  .chip {
    font-family: var(--product);
    font-size: 13px;
    color: #3F464C;
    background: #FFFFFF;
    border: 1px solid #E0E3E5;
    border-radius: 999px;
    padding: 5px 14px;
    cursor: pointer;
  }
  .chip.on { background: #16191C; border-color: #16191C; color: #FFFFFF; }
  .search {
    margin-left: auto;
    font-size: 13px;
    color: #9AA0A6;
    border: 1px solid #E0E3E5;
    border-radius: 4px;
    padding: 6px 14px;
    min-width: 215px;
  }
  table.rows { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.rows th {
    text-align: left;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #6B7177;
    background: #F7F8F8;
    padding: 9px 12px;
    border-top: 1px solid #E6E8EA;
    border-bottom: 1px solid #E6E8EA;
  }
  table.rows td { padding: 11px 12px; border-bottom: 1px solid #EFF1F2; color: #3F464C; }
  table.rows .proj { color: #101214; font-weight: 500; }
  table.rows .sub { display: block; font-size: 12px; color: #80878D; font-weight: 400; }

  /* ---- labels-off tiles ---- */
  .tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-bottom: 30px; }
  .tile { display: flex; flex-direction: column; gap: 7px; }
  .tile img {
    width: 100%;
    aspect-ratio: 596 / 250;
    object-fit: cover;
    background: #F4F4F4;
    border: 1px solid var(--line);
    border-radius: 4px;
  }
  .tile span {
    font-family: var(--shell-ui);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--faint);
  }
  @media (max-width: 760px) {
    .tiles { grid-template-columns: repeat(2, 1fr); }
  }

  /* ---- comparison rows ---- */
  .option { margin-bottom: 30px; }
  .option > h3 {
    font-family: var(--shell-ui);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--faint);
    margin: 0 0 10px;
  }
  .option .stage { margin-bottom: 0; padding: 16px; }
  .option .screen { padding: 18px 20px; }

  /* ---- transcript ---- */
  .transcript {
    width: 100%;
    min-height: 320px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12.5px;
    line-height: 1.5;
  }
  .copied { font-family: var(--shell-ui); font-size: 13px; color: var(--accent); margin-left: 12px; }
  .steps { margin: 0 0 26px; padding-left: 22px; }
  .steps li { margin-bottom: 8px; }
  .steps b { font-weight: 600; }
  .fallback { font-size: 14px; color: var(--muted); margin: 18px 0 8px; }
  .fallback a { color: var(--accent); }
</style>
</head>
<body>
<div class="rail">
  <div class="rail-inner">
    <span id="railStep">Step 1</span>
    <span class="rail-bar"><span class="rail-fill" id="railFill"></span></span>
    <button type="button" class="rail-reset" id="reset">Start over</button>
  </div>
</div>

<div class="wrap" id="app"></div>

    if (saved) state = JSON.parse(saved);
  } catch (e) { /* storage unavailable: run without resume */ }

    try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  // deterministic-per-participant shuffle, recorded so answers stay scoreable
  function shuffle(list, key) {
    if (state.answers["_order_" + key]) {
      var stored = state.answers["_order_" + key];
      return stored.map(function (i) { return list[i]; });
    }
    var index = list.map(function (_, i) { return i; });
    for (var i = index.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = index[i]; index[i] = index[j]; index[j] = t;
    }
    state.answers["_order_" + key] = index;
    save();
    return index.map(function (i) { return list[i]; });
  }

      '<span class="card-head"><span class="card-name">' + mode.name + '</span><span class="plus">+</span></span>' +
      '<span class="card-desc">' + desc + '</span>' +
      '<span class="card-count">' + mode.count + '</span>' +
      '</button>';
  }

        '<td>FTO</td><td>3,927</td><td>-</td><td>Oct 23</td></tr>' +
        '<tr><td class="proj">EP3769722B2<span class="sub">Life Science - demo</span></td>' +
        '<td>Infringement</td><td>627</td><td>-</td><td>Oct 23</td></tr>' +
      '</tbody></table>' +
      '</div></div>';
  }

  // ---------- steps ----------
  var STEPS = [

    { id: "intro", kind: "page",
      title: "Starting a new project",
      lede: '<p>Thank you for doing this. It takes about twenty minutes and you can do it whenever suits you, in one sitting.</p>' +
            '<p>You will see screens from a tool for patent work and be asked to start a few pieces of work on them. Nothing is being graded. We are testing the screen, not you, and finding it confusing is a useful result.</p>' +
            '<p>Two things that make your answers usable:</p>' +
            '<ul><li>Write in sentences where you can. One-word answers tell us almost nothing.</li>' +
            '<li>Do not go back. Once you move on, the page will not return you, and that is deliberate.</li></ul>' +
            '<p>At the end there is a short form to send your answers in. It takes one click and a paste, and your answers do not reach us until you press Submit on it.</p>',
      fields: [
        { key: "who", label: "Your name or initials", type: "text", required: true },
        { key: "years", label: "How long have you worked with patents, and in what role?", type: "text", required: true }
      ],
      next: "Start" },

    { id: "background", kind: "page",
      eyebrow: "Before we look at anything",
      title: "How new work reaches you",
      fields: [
        { key: "bg_last", type: "long", required: true,
          label: "Think about the last new piece of patent work you started from scratch. What landed on your desk, and what was the first thing you did?" },
        { key: "bg_decide", type: "long", required: true,
          label: "When new work comes in, how do you decide what kind of analysis it is?",
          hint: "Describe how that decision actually happens, not how it ideally would." },
        { key: "bg_scope", type: "long", required: true,
          label: "Which kinds of patent analysis do you run yourself, and which do you rarely or never touch?" }
      ] },

    { id: "task1", kind: "task",
      eyebrow: "Task 1 of 3",
      scenario: "A client is about to launch a sensor housing in Germany and France. They want to know whether they are clear to sell it. You have their product spec in front of you.",
      expect: "fto" },

    { id: "task2", kind: "task",
      eyebrow: "Task 2 of 3",
      scenario: "An opposition deadline falls in six weeks on a competitor's granted patent. You need grounds to knock it out.",
      expect: "invalidity" },

    { id: "task3", kind: "task",
      eyebrow: "Task 3 of 3",
      scenario: "An inventor at a client company has a draft idea and wants to know whether it is worth filing.",
      expect: "patentability" },

    { id: "recall", kind: "page",
      eyebrow: "From memory",
      title: "Without looking back",
      notice: "<b>The screen is deliberately not shown here.</b> Please answer from memory. A half-remembered answer is far more useful to us than an accurate one you went back to check.",
      fields: [
        { key: "rc_card", type: "long", required: true,
          label: "Describe the card you chose for the last task. Everything you can remember about it." },
        { key: "rc_image", type: "long", required: true,
          label: "Was there a picture or symbol on the cards? If there was, describe what it showed.",
          hint: "If you did not notice one, say so. That is a real answer." },
        { key: "rc_inout", type: "long", required: true,
          label: "Did anything on the card tell you what you would have to supply, or what you would get back? If so, what told you that?" }
      ] },

    { id: "disc1", kind: "discriminate", set: "B",
      eyebrow: "Pictures only",
      title: "Five pictures, no words" },

    { id: "disc2", kind: "discriminate", set: "C",
      eyebrow: "Pictures only",
      title: "A different five",
      closing: true },

    { id: "compare", kind: "compare",
      eyebrow: "Side by side",
      title: "Four versions of the same row" },

    { id: "done", kind: "done" }
  ];

  // ---------- rendering ----------
  var app = document.getElementById("app");

  function fieldMarkup(f) {
    var id = "f_" + f.key;
    var req = f.required ? "" : ' <span class="req">optional</span>';
    var control = f.type === "text"
      ? '<input type="text" id="' + id + '" data-key="' + f.key + '" value="' + escapeAttr(get(f.key)) + '">'
      : '<textarea id="' + id + '" data-key="' + f.key + '">' + escapeHtml(get(f.key)) + '</textarea>';
    return '<div class="field"><label for="' + id + '">' + f.label + req + '</label>' +
      (f.hint ? '<p class="hint">' + f.hint + '</p>' : "") + control + '</div>';
  }

  function choiceMarkup(key, options) {
    var chosen = get(key);
    return '<div class="choices" data-choice-key="' + key + '">' +
      options.map(function (o) {
        return '<button type="button" class="choice" data-value="' + escapeAttr(o) + '" aria-pressed="' +
          (chosen === o ? "true" : "false") + '">' + escapeHtml(o) + '</button>';
      }).join("") + '</div>';
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function escapeAttr(s) { return escapeHtml(s).replace(/"/g, "&quot;"); }

  function render() {
    var step = STEPS[state.step];
    state.stepEnteredAt = Date.now();
    document.getElementById("railStep").textContent =
      step.kind === "done" ? "Finished" : "Step " + (state.step + 1) + " of " + (STEPS.length - 1);
    document.getElementById("railFill").style.width =
      Math.round((state.step / (STEPS.length - 1)) * 100) + "%";
    window.scrollTo(0, 0);

    if (step.kind === "page") return renderPage(step);
    if (step.kind === "task") return renderTask(step);
    if (step.kind === "discriminate") return renderDiscriminate(step);
    if (step.kind === "compare") return renderCompare(step);
    return renderDone();
  }

  function head(step) {
    return '<div class="col">' +
      (step.eyebrow ? '<p class="eyebrow">' + step.eyebrow + '</p>' : "") +
      (step.title ? '<h1>' + step.title + '</h1>' : "") +
      (step.lede ? '<div class="lede">' + step.lede + '</div>' : "") +
      (step.notice ? '<div class="notice"><span>' + step.notice + '</span></div>' : "") +
      '</div>';
  }

  function footer(label) {
    return '<div class="footer col"><button class="next" id="next" type="button" disabled>' +
      (label || "Continue") + '</button>' +
      '<span class="footnote">You cannot come back to this page.</span></div>';
  }

  function renderPage(step) {
    app.innerHTML = head(step) +
      '<div class="col">' + step.fields.map(fieldMarkup).join("") + '</div>' +
      footer(step.next);
    wireFields();
    gate(step.fields);
  }

  function renderTask(step) {
    var answered = get(step.id + "_choice");
    app.innerHTML = head(step) +
      '<div class="col"><div class="scenario"><p>' + step.scenario + '</p></div>' +
      '<p class="instruct">Start that work on the screen below. Click where you would click.</p></div>' +
      fullScreen(VERSION) +
      '<div class="col" id="afterPick"' + (answered ? "" : " hidden") + '>' +
        fieldMarkup({ key: step.id + "_why", type: "long", required: true,
          label: "In your own words: talk me through how you picked that one." }) +
        fieldMarkup({ key: step.id + "_unsure", type: "long", required: false,
          label: "Was there anything on that screen you were unsure about, or nearly clicked instead?" }) +
      '</div>' + footer();
    wireFields();
    wireScreen(step);
    gate([{ key: step.id + "_choice", required: true }, { key: step.id + "_why", required: true }]);
  }

  function wireScreen(step) {
    var shown = Date.now();
    app.querySelectorAll(".screen .card").forEach(function (card) {
      card.addEventListener("click", function () {
        var mode = card.getAttribute("data-mode");
        log("card-click", { task: step.id, mode: mode, ms: Date.now() - shown });
        if (!get(step.id + "_choice")) {
          set(step.id + "_choice", mode);
          set(step.id + "_ms", String(Date.now() - shown));
        }
        set(step.id + "_final", mode);
        app.querySelectorAll(".screen .card").forEach(function (c) {
          c.style.borderColor = c === card ? "#101214" : "";
        });
        var after = document.getElementById("afterPick");
        after.hidden = false;
        refreshGate();
        after.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    });
    app.querySelectorAll(".screen .chip, .screen .search, .screen .rows td").forEach(function (el) {
      el.addEventListener("click", function () {
        log("other-click", { task: step.id, what: (el.textContent || "").trim().slice(0, 40) });
      });
    });
  }

  function renderDiscriminate(step) {
    var ids = MODES.map(function (m) { return m.id; });
    var order = shuffle(ids, step.set);
    var labels = ["1", "2", "3", "4", "5"];
    var tiles = order.map(function (id, i) {
      return '<div class="tile"><img src="' + GLYPHS[step.set + "_" + id] + '" alt="Picture ' + labels[i] + '"><span>' + labels[i] + '</span></div>';
    }).join("");

    var qs = [
      { key: step.id + "_fto",  text: "Which one would you use to check whether a product is clear to launch?" },
      { key: step.id + "_inv",  text: "Which one is about finding prior art to attack a patent?" },
      { key: step.id + "_sep",  text: "Which one is about a technical standard?" }
    ];

    app.innerHTML = head(step) +
      '<div class="col"><div class="lede"><p>These five pictures come from cards like the ones you have just used, with the words taken off. Answer from the pictures alone. A guess is a useful answer and so is "not sure" &mdash; please do not talk yourself into one.</p></div></div>' +
      '<div class="tiles">' + tiles + '</div>' +
      '<div class="col">' +
        qs.map(function (q) {
          return '<div class="field"><label>' + q.text + '</label>' +
            choiceMarkup(q.key, ["1", "2", "3", "4", "5", "Not sure"]) + '</div>';
        }).join("") +
        fieldMarkup({ key: step.id + "_read", type: "long", required: true,
          label: "Pick any one of the five and write what you think it is telling you.",
          hint: "Say which number, then what you read into it." }) +
        fieldMarkup({ key: step.id + "_apart", type: "long", required: true,
          label: "Did these five look clearly different from each other, or did they blur together?",
          hint: "Describe what you actually saw, not what you think you should have seen." }) +
        (step.closing ? fieldMarkup({ key: "sets_compare", type: "long", required: true,
          label: "You have now seen two sets of pictures. Did either set work better for you? What made the difference?" }) : "") +
      '</div>' + footer();

    wireFields();
    wireChoices();
    var required = qs.map(function (q) { return { key: q.key, required: true }; })
      .concat([{ key: step.id + "_read", required: true }, { key: step.id + "_apart", required: true }]);
    if (step.closing) required.push({ key: "sets_compare", required: true });
    gate(required);
  }

  function renderCompare(step) {
    var variants = ["a", "b", "c", "d"];
    var order = shuffle(variants, "compare");
    var blocks = order.map(function (v, i) {
      return '<div class="option"><h3>Option ' + (i + 1) + '</h3>' +
        '<div class="stage"><div class="screen">' + cardRow(v) + '</div></div></div>';
    }).join("");

    app.innerHTML = head(step) +
      '<div class="col"><div class="lede"><p>Here is the row of cards in four versions. They differ only in what sits above and under the names.</p></div></div>' +
      blocks +
      '<div class="col">' +
        '<div class="field"><label>If you were starting a new project tomorrow, which version would you rather have in front of you?</label>' +
          choiceMarkup("cmp_pick", ["Option 1", "Option 2", "Option 3", "Option 4", "No preference"]) + '</div>' +
        fieldMarkup({ key: "cmp_why", type: "long", required: true,
          label: "What made you pick that one?" }) +
        fieldMarkup({ key: "cmp_use", type: "long", required: true,
          label: "Is there anything in any of these you would actually use when deciding, as opposed to just look at?",
          hint: "Say which, and at what moment you would use it." }) +
        fieldMarkup({ key: "cmp_when", type: "long", required: true,
          label: "Some things on a screen are useful every single time you see them. Others are only useful the first time, while you are learning. Where do these pictures fall for you?" }) +
        fieldMarkup({ key: "cmp_change", type: "long", required: true,
          label: "If you could change one thing about this screen so the choice was easier, what would it be?" }) +
        fieldMarkup({ key: "cmp_any", type: "long", required: false,
          label: "Anything else you want to say?" }) +
      '</div>' + footer("Finish");

    wireFields();
    wireChoices();
    gate([{ key: "cmp_pick", required: true }, { key: "cmp_why", required: true },
          { key: "cmp_use", required: true }, { key: "cmp_when", required: true },
          { key: "cmp_change", required: true }]);
  }

  var FORM_URL = "https://airtable.com/appBBw49vPjKAn3e4/pag1N6Iz6V754K7Fu/form";

  var TASKS = [["task1", "FTO", "fto"], ["task2", "Invalidity", "invalidity"], ["task3", "Patentability", "patentability"]];

  function setScore(setKey, stepId) {
    var order = state.answers["_order_" + setKey] || [];
    var wanted = [[stepId + "_fto", "fto"], [stepId + "_inv", "invalidity"], [stepId + "_sep", "sep"]];
    return wanted.filter(function (q) {
      var pick = get(q[0]);
      if (!pick || pick === "Not sure") return false;
      return MODES[order[Number(pick) - 1]].id === q[1];
    }).length;
  }

  function preferredLabel() {
    var pick = get("cmp_pick");
    if (!pick) return "";
    if (pick === "No preference") return "No preference";
    var order = state.answers["_order_compare"] || [];
    var variants = ["a", "b", "c", "d"];
    var v = variants[order[Number(pick.replace("Option ", "")) - 1]];
    return VERSION_LABEL[v];
  }

  function summary() {
    return {
      "Participant": get("who"),
      "Background": get("years"),
      "Version shown": VERSION.toUpperCase() + " - " + VERSION_LABEL[VERSION],
      "Minutes": String(Math.round((Date.now() - state.started) / 60000)),
      "Tasks correct": String(TASKS.filter(function (t) { return get(t[0] + "_choice") === t[2]; }).length),
      "Task detail": TASKS.map(function (t) {
        return t[1] + ": " + (get(t[0] + "_choice") || "none") +
          " " + Math.round(Number(get(t[0] + "_ms") || 0) / 1000) + "s";
      }).join("; "),
      "In-out score": String(setScore("B", "disc1")),
      "Abstract score": String(setScore("C", "disc2")),
      "Preferred": preferredLabel()
    };
  }

  function formLink() {
    var values = summary();
    var parts = [];
    Object.keys(values).forEach(function (name) {
      parts.push("prefill_" + encodeURIComponent(name) + "=" + encodeURIComponent(values[name]));
      if (name !== "Participant") parts.push("hide_" + encodeURIComponent(name) + "=true");
    });
    return FORM_URL + "?" + parts.join("&");
  }

  function renderDone() {
    app.innerHTML =
      '<div class="col"><p class="eyebrow">One step left</p><h1>Send your answers</h1>' +
      '<div class="lede"><p>Your answers are not sent yet. Three things and you are done.</p></div>' +
      '<ol class="steps">' +
        '<li>Press the button below. It copies your answers and opens a short form in a new tab.</li>' +
        '<li>Click in the big box on that form and paste.</li>' +
        '<li>Press <b>Submit</b> on the form.</li>' +
      '</ol>' +
      '<p><button class="next" id="send" type="button">Copy my answers and open the form</button>' +
      '<span class="copied" id="copied" hidden>Copied. The form is open in the other tab.</span></p>' +
      '<p class="fallback">If the form did not open, <a id="formLink" href="#" target="_blank" rel="noopener">open it here</a>. ' +
      'If the paste does not work, copy the text below by hand.</p>' +
      '<textarea class="transcript" id="out" readonly></textarea></div>';

    var out = document.getElementById("out");
    out.value = transcript();
    document.getElementById("formLink").href = formLink();

    document.getElementById("send").addEventListener("click", function () {
      out.select();
      try { document.execCommand("copy"); } catch (e) {}
      if (navigator.clipboard) navigator.clipboard.writeText(out.value).catch(function () {});
      window.open(formLink(), "_blank", "noopener");
      document.getElementById("copied").hidden = false;
    });
  }

  // ---------- wiring ----------
  function wireFields() {
    app.querySelectorAll("input[data-key], textarea[data-key]").forEach(function (el) {
      el.addEventListener("input", function () {
        set(el.getAttribute("data-key"), el.value);
        refreshGate();
      });
    });
  }

  function wireChoices() {
    app.querySelectorAll(".choices").forEach(function (group) {
      var key = group.getAttribute("data-choice-key");
      group.querySelectorAll(".choice").forEach(function (btn) {
        btn.addEventListener("click", function () {
          group.querySelectorAll(".choice").forEach(function (b) { b.setAttribute("aria-pressed", "false"); });
          btn.setAttribute("aria-pressed", "true");
          set(key, btn.getAttribute("data-value"));
          refreshGate();
        });
      });
    });
  }

  var gateFields = [];
  function gate(fields) {
    gateFields = fields.filter(function (f) { return f.required; });
    var next = document.getElementById("next");
    next.onclick = function () {
      log("step-done", { step: STEPS[state.step].id, ms: Date.now() - state.stepEnteredAt });
      state.step += 1;
      save();
      render();
    };
    refreshGate();
  }

  function refreshGate() {
    var next = document.getElementById("next");
    if (!next) return;
    var ready = gateFields.every(function (f) { return String(get(f.key)).trim().length > 0; });
    next.disabled = !ready;
  }

  // ---------- transcript ----------
  function transcript() {
    var lines = [];
    lines.push("MODE GLYPH TEST - RESPONSES");
    lines.push("Participant: " + get("who"));
    lines.push("Background: " + get("years"));
    lines.push("Version shown during tasks: " + VERSION.toUpperCase() + " (" + VERSION_LABEL[VERSION] + ")");
    lines.push("Completed: " + new Date().toISOString());
    lines.push("Total time: " + Math.round((Date.now() - state.started) / 60000) + " min");
    lines.push("");

    function block(heading, pairs) {
      lines.push("--- " + heading + " ---");
      pairs.forEach(function (p) {
        lines.push("Q: " + p[0]);
        lines.push("A: " + (String(get(p[1])).trim() || "(blank)"));
        lines.push("");
      });
    }

    block("BACKGROUND", [
      ["Last new piece of work", "bg_last"],
      ["How the analysis type is decided", "bg_decide"],
      ["What they run themselves", "bg_scope"]
    ]);

    [["task1", "FTO scenario", "fto"], ["task2", "Invalidity scenario", "invalidity"],
     ["task3", "Patentability scenario", "patentability"]].forEach(function (t) {
      lines.push("--- TASK: " + t[1] + " ---");
      var first = get(t[0] + "_choice");
      lines.push("First click: " + (first || "(none)") + (first === t[2] ? "  [expected]" : "  [NOT expected: " + t[2] + "]"));
      lines.push("Final choice: " + get(t[0] + "_final"));
      lines.push("Seconds to first click: " + Math.round(Number(get(t[0] + "_ms") || 0) / 1000));
      lines.push("Q: How they picked it");
      lines.push("A: " + (String(get(t[0] + "_why")).trim() || "(blank)"));
      lines.push("Q: Anything unsure about");
      lines.push("A: " + (String(get(t[0] + "_unsure")).trim() || "(blank)"));
      lines.push("");
    });

    block("RECALL (screen hidden)", [
      ["Describe the card you chose", "rc_card"],
      ["Was there a picture, what did it show", "rc_image"],
      ["Did anything say what you supply / get back", "rc_inout"]
    ]);

    [["disc1", "B", "IN-OUT GLYPHS"], ["disc2", "C", "ABSTRACT GLYPHS"]].forEach(function (d) {
      var order = state.answers["_order_" + d[1]] || [];
      var shown = order.map(function (i, pos) { return (pos + 1) + "=" + MODES[i].id; }).join(", ");
      lines.push("--- PICTURES ONLY: " + d[2] + " ---");
      lines.push("Tile order shown: " + shown);
      [["Clear a product to launch (correct: fto)", d[0] + "_fto", "fto"],
       ["Prior art to attack a patent (correct: invalidity)", d[0] + "_inv", "invalidity"],
       ["About a technical standard (correct: sep)", d[0] + "_sep", "sep"]].forEach(function (q) {
        var pick = get(q[1]);
        var actual = "(not sure)";
        if (pick !== "Not sure" && pick) actual = MODES[order[Number(pick) - 1]].id;
        lines.push("Q: " + q[0]);
        lines.push("A: picked " + pick + " = " + actual + (actual === q[2] ? "  [correct]" : "  [wrong]"));
      });
      lines.push("");
      lines.push("Q: What one of them is telling you");
      lines.push("A: " + (String(get(d[0] + "_read")).trim() || "(blank)"));
      lines.push("Q: Did they look different or blur together");
      lines.push("A: " + (String(get(d[0] + "_apart")).trim() || "(blank)"));
      lines.push("");
    });

    lines.push("Q: Did either set work better");
    lines.push("A: " + (String(get("sets_compare")).trim() || "(blank)"));
    lines.push("");

    var cmpOrder = state.answers["_order_compare"] || [];
    var variants = ["a", "b", "c", "d"];
    lines.push("--- COMPARISON ---");
    lines.push("Options shown as: " + cmpOrder.map(function (i, pos) {
      return "Option " + (pos + 1) + "=" + variants[i].toUpperCase() + " (" + VERSION_LABEL[variants[i]] + ")";
    }).join(", "));
    var pick = get("cmp_pick");
    var pickedVariant = "(none)";
    if (pick && pick !== "No preference") {
      var pos = Number(pick.replace("Option ", "")) - 1;
      pickedVariant = variants[cmpOrder[pos]].toUpperCase() + " (" + VERSION_LABEL[variants[cmpOrder[pos]]] + ")";
    } else if (pick) {
      pickedVariant = "No preference";
    }
    lines.push("Preferred: " + pick + " = " + pickedVariant);
    lines.push("");
    block("COMPARISON ANSWERS", [
      ["Why that one", "cmp_why"],
      ["Would actually use when deciding", "cmp_use"],
      ["Every time, or only while learning", "cmp_when"],
      ["One thing to change", "cmp_change"],
      ["Anything else", "cmp_any"]
    ]);

    lines.push("--- CLICK LOG ---");
    state.events.forEach(function (e) {
      lines.push(Math.round(e.at / 1000) + "s  " + e.kind + "  " + JSON.stringify(e.detail));
    });

    return lines.join("\n");
  }

  document.getElementById("reset").addEventListener("click", function () {
    if (!window.confirm("Clear every answer and start from the beginning?")) return;
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    state = { step: 0, answers: {}, events: [], started: Date.now(), stepEnteredAt: Date.now() };
    save();
    render();
  });

  render();
})();
</script>
</body>
</html>
